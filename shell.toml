# Aincrad-inspired system cards over the dark Link Start palette.
# Uses Omarchy shell surface tokens; unspecified settings use shell defaults.

[bar]
background = "#08090a"
background-alpha = 0.96
text = "#e9f2f5"
active = "#ff3b5c"

[controls]
normal-color = "#e9f2f5"
normal-fill-alpha = 0.04
normal-border = "#c3d6dd"
normal-border-width = 1
normal-border-alpha = 0.35
hover-cursor-color = "#3ee8ff"
hover-cursor-fill-alpha = 0.10
hover-cursor-border = "#3ee8ff"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.65
focus-color = "#3ee8ff"
focus-fill-alpha = 0.12
focus-border = "#3ee8ff"
focus-border-width = 1
focus-border-alpha = 1.0
selected-color = "#3ee8ff"
selected-fill-alpha = 0.16
selected-border = "#3ee8ff"
selected-border-width = 1
selected-border-alpha = 0.8

[popups]
background = "#16181b"
background-alpha = 0.96
text = "#e9f2f5"
border = "#3ee8ff"
border-alpha = 0.7
border-width = "1 1 1 3"

# Pale system messages evoke Aincrad's translucent interface panels.
[notifications]
background = "#e9f2f5"
background-alpha = 0.94
text = "#16181b"
border = "#c3d6dd"
border-alpha = 0.9
border-width = "1 1 1 3"
# A darker HP green stays visible on the pale card. This is the actual
# notification lifetime indicator; critical notifications still use red.
countdown = "#16734b"

[tooltip]
background = "#e9f2f5"
background-alpha = 0.97
text = "#16181b"
border = "#c3d6dd"
border-alpha = 0.9
border-width = 1

[menu]
background = "#16181b"
background-alpha = 0.96
text = "#e9f2f5"
border = "#c3d6dd"
border-alpha = 0.65
border-width = "1 1 1 3"
scrim = "#030304"
scrim-alpha = 0.55
selected-background = "#3ee8ff"
selected-background-alpha = 0.12
selected-text = "#7dfaff"
selected-border = "#3ee8ff"
selected-border-alpha = 0.8

[launcher]
background = "#16181b"
background-alpha = 0.96
text = "#e9f2f5"
border = "#c3d6dd"
border-alpha = 0.65
border-width = "1 1 1 3"
scrim = "#030304"
scrim-alpha = 0.55
selected-background = "#3ee8ff"
selected-background-alpha = 0.12
selected-text = "#7dfaff"
selected-border = "#3ee8ff"
selected-border-alpha = 0.8
