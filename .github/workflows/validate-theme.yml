name: Validate theme

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Theme package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes imagemagick shellcheck python3

      - name: Run ShellCheck
        run: shellcheck tests/validate-theme.sh

      - name: Test configuration validator
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Validate theme package
        run: bash tests/validate-theme.sh
